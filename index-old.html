<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#05090d">
  <title>SIGNAL // NULL v4.2 — NORN Pulse</title>
  <style>
    :root {
      --cyan: #5ef6e8;
      --cyan-soft: rgba(94, 246, 232, .18);
      --amber: #ffc857;
      --red: #ff5263;
      --ink: #d9fffb;
      --panel: rgba(5, 13, 19, .92);
      --line: rgba(94, 246, 232, .28);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05090d;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    button { font: inherit; }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background: #071017;
    }

    .scanlines,
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .scanlines {
      opacity: .17;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(94, 246, 232, .08) 4px
      );
      mix-blend-mode: screen;
    }

    .vignette {
      background: radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, .68) 115%);
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .hud-top {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: minmax(145px, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .brand,
    .metrics,
    #objective,
    #minimap-wrap {
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(7, 20, 28, .93), rgba(3, 9, 14, .82));
      box-shadow: 0 0 24px rgba(0, 0, 0, .34), inset 0 0 22px rgba(94, 246, 232, .025);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .brand {
      width: fit-content;
      min-width: 156px;
      padding: 8px 10px;
      letter-spacing: .12em;
      font-size: 12px;
      line-height: 1.35;
    }

    .brand strong {
      display: block;
      color: var(--cyan);
      font-size: 14px;
      text-shadow: 0 0 12px rgba(94, 246, 232, .5);
    }

    .brand span { opacity: .62; }

    .metrics {
      justify-self: end;
      min-width: 168px;
      padding: 7px 9px;
      font-size: 11px;
      letter-spacing: .04em;
    }

    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 18px;
    }

    .metric-row b { color: #fff; font-size: 12px; }

    .bar {
      position: relative;
      height: 5px;
      margin-top: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, .08);
    }

    #trace-bar {
      width: 0;
      height: 100%;
      background: var(--cyan);
      box-shadow: 0 0 10px currentColor;
      transition: width .15s linear, background .2s;
    }

    #objective {
      position: absolute;
      top: max(92px, calc(env(safe-area-inset-top) + 88px));
      left: max(10px, env(safe-area-inset-left));
      max-width: min(390px, calc(100vw - 20px));
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.45;
    }

    #objective .tag {
      color: var(--amber);
      letter-spacing: .12em;
      font-size: 9px;
    }

    #objective-text { display: block; color: #fff; }

    #minimap-wrap {
      position: absolute;
      top: max(92px, calc(env(safe-area-inset-top) + 88px));
      right: max(10px, env(safe-area-inset-right));
      width: 146px;
      height: 102px;
      padding: 4px;
    }

    #minimap {
      display: block;
      width: 136px;
      height: 92px;
      opacity: .9;
    }

    .hud-buttons {
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      top: max(202px, calc(env(safe-area-inset-top) + 198px));
      display: flex;
      gap: 7px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 42px;
      height: 34px;
      border: 1px solid var(--line);
      color: var(--cyan);
      background: rgba(5, 13, 19, .88);
      cursor: pointer;
    }

    .icon-btn:active { transform: scale(.96); }

    #toast {
      position: absolute;
      left: 50%;
      top: 26%;
      max-width: min(520px, 86vw);
      padding: 9px 14px;
      border-left: 3px solid var(--cyan);
      color: #fff;
      background: rgba(3, 10, 15, .88);
      opacity: 0;
      transform: translate(-50%, -8px);
      transition: opacity .25s, transform .25s;
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
    }

    #toast.visible { opacity: 1; transform: translate(-50%, 0); }

    #norn-core {
      position: absolute;
      top: max(205px, calc(env(safe-area-inset-top) + 200px));
      left: max(10px, env(safe-area-inset-left));
      width: min(350px, calc(100vw - 176px));
      min-height: 92px;
      padding: 8px 10px;
      border: 1px solid rgba(94, 246, 232, .34);
      border-left: 3px solid var(--cyan);
      background: rgba(3, 11, 17, .88);
      box-shadow: 0 0 25px rgba(0, 0, 0, .34), inset 0 0 22px rgba(94, 246, 232, .035);
      font-size: 9px;
      line-height: 1.35;
    }

    .norn-head,
    .norn-readout,
    .norn-power {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .norn-head {
      color: var(--cyan);
      letter-spacing: .12em;
      margin-bottom: 5px;
    }

    #norn-status { color: #7dff9a; font-size: 8px; }

    #norn-message {
      min-height: 28px;
      color: rgba(234, 255, 253, .9);
      font-size: 10px;
    }

    .norn-readout { color: rgba(217, 255, 251, .58); }
    .norn-readout b { color: #fff; }
    #threat-probability { color: #ff8994; }

    .belief-bar,
    .power-bar {
      height: 3px;
      margin: 4px 0;
      overflow: hidden;
      background: rgba(255, 82, 99, .28);
    }

    #belief-fill,
    #power-fill {
      display: block;
      width: 50%;
      height: 100%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      transition: width .45s ease;
    }

    .norn-power { color: rgba(217, 255, 251, .44); }
    .power-bar { flex: 1; margin: 0; background: rgba(255,255,255,.07); }
    #power-fill { width: 100%; background: var(--amber); box-shadow: 0 0 7px var(--amber); }

    #agent-tools {
      position: absolute;
      right: max(17px, calc(env(safe-area-inset-right) + 7px));
      bottom: max(153px, calc(env(safe-area-inset-bottom) + 143px));
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .agent-tool {
      width: 61px;
      height: 42px;
      padding: 3px;
      border: 1px solid rgba(94, 246, 232, .42);
      color: var(--cyan);
      background: rgba(4, 16, 22, .9);
      font-size: 9px;
      line-height: 1.1;
      cursor: pointer;
      touch-action: manipulation;
    }

    .agent-tool small { display: block; margin-top: 3px; color: var(--amber); font-size: 7px; }
    .agent-tool:active { transform: scale(.95); }
    .agent-tool:disabled { opacity: .3; filter: grayscale(1); }

    #controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #joystick {
      position: absolute;
      left: max(22px, calc(env(safe-area-inset-left) + 12px));
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px));
      width: 118px;
      height: 118px;
      border: 1px solid rgba(94, 246, 232, .32);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 246, 232, .08), rgba(3, 10, 15, .44) 65%);
      box-shadow: inset 0 0 24px rgba(94, 246, 232, .07);
      pointer-events: auto;
      touch-action: none;
    }

    #joystick::before,
    #joystick::after {
      content: "";
      position: absolute;
      background: rgba(94, 246, 232, .12);
    }

    #joystick::before { left: 50%; top: 12px; bottom: 12px; width: 1px; }
    #joystick::after { top: 50%; left: 12px; right: 12px; height: 1px; }

    #stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      margin: -24px;
      border: 1px solid rgba(94, 246, 232, .65);
      border-radius: 50%;
      background: rgba(17, 52, 60, .8);
      box-shadow: 0 0 18px rgba(94, 246, 232, .2);
      will-change: transform;
    }

    #action {
      position: absolute;
      right: max(22px, calc(env(safe-area-inset-right) + 12px));
      bottom: max(30px, calc(env(safe-area-inset-bottom) + 20px));
      width: 112px;
      height: 112px;
      border: 1px solid rgba(255, 200, 87, .72);
      border-radius: 50%;
      color: #fff1c7;
      background: radial-gradient(circle, rgba(104, 76, 20, .78), rgba(20, 16, 7, .82));
      box-shadow: 0 0 24px rgba(255, 200, 87, .12), inset 0 0 22px rgba(255, 200, 87, .1);
      letter-spacing: .08em;
      font-weight: 700;
      font-size: 12px;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #action.ready {
      animation: actionPulse 1.3s infinite;
      box-shadow: 0 0 28px rgba(255, 200, 87, .38), inset 0 0 22px rgba(255, 200, 87, .14);
    }

    #action:active { transform: scale(.95); }

    @keyframes actionPulse {
      50% { border-color: #fff4c7; box-shadow: 0 0 38px rgba(255, 200, 87, .48); }
    }

    #desktop-help {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: rgba(217, 255, 251, .44);
      font-size: 10px;
      white-space: nowrap;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      background: rgba(1, 6, 10, .78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #overlay.hidden { display: none; }

    .panel {
      position: relative;
      width: min(650px, 94vw);
      max-height: 92vh;
      overflow: auto;
      padding: clamp(20px, 4vw, 38px);
      border: 1px solid rgba(94, 246, 232, .42);
      background:
        linear-gradient(135deg, rgba(94, 246, 232, .05), transparent 35%),
        var(--panel);
      box-shadow: 0 0 60px rgba(0, 0, 0, .62), inset 0 0 40px rgba(94, 246, 232, .025);
    }

    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: var(--cyan);
      pointer-events: none;
    }

    .panel::before { left: -1px; top: -1px; border-left: 3px solid; border-top: 3px solid; }
    .panel::after { right: -1px; bottom: -1px; border-right: 3px solid; border-bottom: 3px solid; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--cyan);
      letter-spacing: .18em;
      font-size: 11px;
    }

    h1, h2 { margin: 0; line-height: 1.05; }
    h1 { color: #fff; font-size: clamp(31px, 8vw, 66px); letter-spacing: -.04em; }
    h1 span { color: var(--cyan); }
    h2 { color: #fff; font-size: clamp(22px, 4vw, 34px); }

    .lead {
      margin: 18px 0;
      color: rgba(217, 255, 251, .82);
      line-height: 1.65;
      font-size: 13px;
    }

    .brief-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin: 18px 0;
      background: rgba(94, 246, 232, .18);
      border: 1px solid rgba(94, 246, 232, .18);
    }

    .brief-grid > div { padding: 11px; background: #071118; }
    .brief-grid small { display: block; opacity: .55; margin-bottom: 4px; }
    .brief-grid b { color: var(--amber); font-size: 13px; }

    .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

    .primary,
    .secondary,
    .danger-choice {
      min-height: 46px;
      padding: 11px 16px;
      border: 1px solid var(--cyan);
      color: #031011;
      background: var(--cyan);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .secondary {
      color: var(--cyan);
      background: transparent;
      border-color: rgba(94, 246, 232, .48);
    }

    .danger-choice {
      color: #fff1f3;
      background: rgba(255, 82, 99, .12);
      border-color: var(--red);
    }

    .primary:active,
    .secondary:active,
    .danger-choice:active { transform: translateY(1px); }

    .evidence-list {
      display: grid;
      gap: 8px;
      margin: 16px 0;
    }

    .evidence-item {
      padding: 10px 12px;
      border-left: 2px solid var(--amber);
      background: rgba(255, 200, 87, .06);
      color: rgba(255, 248, 225, .88);
      font-size: 12px;
      line-height: 1.5;
    }

    .score {
      color: var(--amber);
      font-size: clamp(24px, 6vw, 42px);
      font-weight: 900;
    }

    .tiny { color: rgba(217, 255, 251, .48); font-size: 10px; line-height: 1.5; }

    .glitch { animation: glitch .18s 2; }
    @keyframes glitch {
      25% { transform: translateX(3px); filter: hue-rotate(40deg); }
      75% { transform: translateX(-2px); }
    }

    @media (hover: hover) and (pointer: fine) {
      #joystick, #action { opacity: .3; }
      #joystick:hover, #action:hover { opacity: .9; }
    }

    @media (max-width: 600px) {
      .hud-top { grid-template-columns: 1fr auto; }
      .metrics { min-width: 142px; }
      #objective { right: 10px; max-width: none; }
      #minimap-wrap { top: 176px; width: 118px; height: 82px; }
      #minimap { width: 108px; height: 72px; }
      .hud-buttons { top: 264px; }
      #norn-core { top: 270px; width: calc(100vw - 165px); }
      .brief-grid { grid-template-columns: 1fr; }
      #desktop-help { display: none; }
    }

    @media (max-height: 520px) {
      #objective { top: 78px; max-width: 48vw; }
      #minimap-wrap { top: 78px; }
      .hud-buttons { top: 187px; }
      #norn-core { top: 145px; width: 42vw; min-height: 76px; }
      #norn-message { min-height: 22px; }
      #agent-tools { bottom: 112px; }
      #joystick { width: 96px; height: 96px; }
      #stick { width: 42px; height: 42px; margin: -21px; }
      #action { width: 92px; height: 92px; }
      .panel { padding: 20px; }
      .lead { margin: 11px 0; }
      .brief-grid { margin: 11px 0; grid-template-columns: repeat(3, 1fr); }
    }

    /* Kompakt landskaps-HUD: holder midten av spillefeltet fri på mobil. */
    @media (orientation: landscape) and (max-height: 600px) {
      .hud-top {
        top: max(5px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        display: block;
      }

      .brand {
        position: absolute;
        top: 0;
        left: 0;
        min-width: 0;
        max-width: 175px;
        padding: 5px 8px;
        font-size: 8px;
        line-height: 1.2;
      }

      .brand strong { font-size: 11px; }

      .metrics {
        position: absolute;
        top: 0;
        right: 0;
        width: 132px;
        min-width: 132px;
        padding: 5px 7px;
        font-size: 8px;
      }

      .metric-row { min-height: 14px; gap: 7px; }
      .metric-row b { font-size: 9px; }
      .bar { height: 3px; margin-top: 2px; }

      #objective {
        top: max(49px, calc(env(safe-area-inset-top) + 45px));
        left: max(8px, env(safe-area-inset-left));
        right: auto;
        width: min(265px, 34vw);
        max-width: min(265px, 34vw);
        padding: 5px 8px;
        font-size: 8px;
        line-height: 1.25;
      }

      #objective .tag { font-size: 7px; }

      #minimap-wrap {
        top: max(49px, calc(env(safe-area-inset-top) + 45px));
        right: max(8px, env(safe-area-inset-right));
        width: 100px;
        height: 70px;
        padding: 3px;
      }

      #minimap { width: 94px; height: 64px; }

      .hud-buttons {
        top: max(123px, calc(env(safe-area-inset-top) + 119px));
        right: max(8px, env(safe-area-inset-right));
        gap: 4px;
      }

      .icon-btn { width: 37px; height: 28px; font-size: 9px; }

      #toast {
        top: max(7px, env(safe-area-inset-top));
        max-width: 40vw;
        padding: 5px 9px;
        border-left-width: 2px;
        background: rgba(3, 10, 15, .78);
        font-size: 8px;
        line-height: 1.25;
      }

      #norn-core {
        top: auto;
        bottom: max(7px, env(safe-area-inset-bottom));
        left: 50%;
        width: min(315px, 38vw);
        min-height: 0;
        padding: 5px 8px;
        transform: translateX(-50%);
        background: rgba(3, 11, 17, .78);
        font-size: 7px;
        line-height: 1.18;
      }

      .norn-head { margin-bottom: 2px; }
      #norn-status { font-size: 6px; }
      #norn-message {
        min-height: 0;
        max-height: 20px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        font-size: 8px;
      }
      .norn-readout, .norn-power { font-size: 7px; }
      .belief-bar, .power-bar { height: 2px; margin: 2px 0; }

      #agent-tools {
        right: max(97px, calc(env(safe-area-inset-right) + 87px));
        bottom: max(82px, calc(env(safe-area-inset-bottom) + 72px));
        gap: 4px;
      }

      .agent-tool {
        width: 49px;
        height: 32px;
        padding: 2px;
        font-size: 7px;
      }

      .agent-tool small { margin-top: 1px; font-size: 6px; }

      #joystick {
        left: max(10px, env(safe-area-inset-left));
        bottom: max(10px, env(safe-area-inset-bottom));
        width: 82px;
        height: 82px;
        opacity: .82;
      }

      #joystick::before { top: 9px; bottom: 9px; }
      #joystick::after { left: 9px; right: 9px; }
      #stick { width: 36px; height: 36px; margin: -18px; }

      #action {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
        width: 76px;
        height: 76px;
        font-size: 9px;
        opacity: .9;
      }

      #desktop-help { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Spillområde"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <section id="hud" aria-live="polite">
    <div class="hud-top">
      <div class="brand"><strong>NORN//9</strong><span>SIGNAL NULL · AGENT</span></div>
      <div class="metrics">
        <div class="metric-row"><span>TID</span><b id="timer">02:50</b></div>
        <div class="metric-row"><span>SPOR</span><b id="evidence-count">0 / 3</b></div>
        <div class="metric-row"><span>EKSPONERING</span><b id="trace-value">0%</b></div>
        <div class="bar"><div id="trace-bar"></div></div>
      </div>
    </div>

    <div id="objective">
      <span class="tag">AKTIV OPPGAVE</span>
      <span id="objective-text">Venter på signal …</span>
    </div>

    <div id="minimap-wrap"><canvas id="minimap" width="272" height="184" aria-label="Minikart"></canvas></div>

    <div class="hud-buttons">
      <button id="music" class="icon-btn" aria-label="Slå musikk av eller på">MUS♫</button>
      <button id="sound" class="icon-btn" aria-label="Slå lydeffekter av eller på">SFX</button>
      <button id="pause" class="icon-btn" aria-label="Pause spillet">II</button>
    </div>

    <div id="toast"></div>

    <aside id="norn-core" aria-label="NORN analyse">
      <div class="norn-head"><strong>NORN//AGENT</strong><b id="norn-status">ONLINE</b></div>
      <div id="norn-message">Kartlegger sanntidsstrømmer …</div>
      <div class="norn-readout">
        <span>OFFER <b id="victim-probability">50%</b></span>
        <span>TRUSSEL <b id="threat-probability">50%</b></span>
      </div>
      <div class="belief-bar"><i id="belief-fill"></i></div>
      <div class="norn-power"><span>KRAFT <b id="power-value">100%</b></span><div class="power-bar"><i id="power-fill"></i></div></div>
    </aside>

    <div id="controls">
      <div id="joystick" aria-label="Virtuell styrespak"><div id="stick"></div></div>
      <div id="agent-tools" aria-label="NORN-handlinger">

      overlay.classList.remove("hidden");
      const found = state.evidenceItems
        .filter(item => item.collected)
        .map(item => `<div class="evidence-item"><strong>${item.label}:</strong> ${state.caseData.evidence[item.id]}</div>`)
        .join("");
      overlay.innerHTML = `
        <main class="panel">
          <p class="eyebrow">BESLUTNINGSPUNKT · R-742</p>
          <h2>Offer eller gjerningsperson?</h2>
          <p class="lead"><strong>NORN:</strong> Min modell beregner offer ${Math.round(state.victimProbability)}% og trussel ${100 - Math.round(state.victimProbability)}%. Jeg kan forutsi handling, men ikke moralsk ansvar. Beslutningen er din.</p>
          <div class="evidence-list">${found}</div>
          <div class="button-row">
            <button class="primary" data-act="protect">BESKYTT R-742</button>
            <button class="danger-choice" data-act="stop">STANS R-742</button>
            <button class="secondary" data-act="continue">UNDERSØK MER</button>
          </div>
        </main>`;
    }

    function showPause() {
      if (state.mode !== "playing") return;
      state.mode = "paused";
      setMusicLevel(desiredMusicLevel(), .2);
      overlay.classList.remove("hidden");
      overlay.innerHTML = `
        <main class="panel">
          <p class="eyebrow">FORBINDELSEN ER SATT PÅ VENT</p>
          <h2>Pause</h2>
          <p class="lead">Nedtellingen og alle aktører er stanset.</p>
          <div class="button-row">
            <button class="primary" data-act="resume">FORTSETT</button>
            <button class="secondary" data-act="restart">START NY SAK</button>
          </div>
        </main>`;
    }

    function decide(choice) {
      const won = choice === state.caseData.correct;
      state.score = won
        ? Math.max(0, Math.round(state.time * 10 + state.evidence.length * 400 + (100 - state.trace) * 6))
        : 0;
      endGame(won, won ? state.caseData.success : state.caseData.failure);
    }

    function endGame(won, message) {
      state.mode = "end";
      setMusicLevel(desiredMusicLevel(), .65);
      overlay.classList.remove("hidden");
      const title = won ? "Hendelsen er avverget" : "Signalet gikk tapt";
      const label = won ? "SAK LUKKET" : "FEIL BESLUTNING";
      if (won) {
        beep(620, .09, "square", .03);
        setTimeout(() => beep(820, .11, "square", .03), 120);
        setTimeout(() => beep(1080, .14, "square", .025), 250);
      } else {
        beep(170, .28, "sawtooth", .035);
        buzz([60, 50, 100]);
      }
      overlay.innerHTML = `
        <main class="panel ${won ? "" : "glitch"}">
          <p class="eyebrow">${label}</p>
          <h2>${title}</h2>
          <p class="lead">${message}</p>
          ${won ? `<div class="score">${state.score.toLocaleString("nb-NO")} poeng</div>` : ""}
          <p class="tiny">Sakens rolle fordeles tilfeldig hver gang. Sporene – ikke fargen på personen – avslører riktig valg.</p>
          <div class="button-row"><button class="primary" data-act="restart">NY SAK</button></div>
        </main>`;
    }

    function handleOverlayAction(action) {
      if (action === "start" || action === "restart") startGame();
      else if (action === "continue" || action === "resume") {
        state.mode = "playing";
        unlockAudio(false);
        setMusicLevel(desiredMusicLevel(), .2);
        overlay.classList.add("hidden");
        beep(620, .045, "square", .018);
      } else if (action === "protect" || action === "stop") {
        decide(action);
      }
    }

    function showToast(message, duration = 2400) {
      toastEl.textContent = message;
      toastEl.classList.add("visible");
      state.toastTimer = duration / 1000;
    }

    function nornSay(message, announce = false) {
      state.nornLog.unshift(message);
      state.nornLog.length = Math.min(state.nornLog.length, 6);
      nornMessageEl.textContent = message;
      nornStatusEl.textContent = state.detected ? "MOTARBEIDER" : "ANALYSERER";
      beep(680, .045, "square", .011);
      beep(920, .035, "square", .008, .052);
      if (announce) showToast(`NORN: ${message}`, 3000);
    }

    function updateBelief() {
      const weights = { cctv: 14, badge: 22, witness: 18 };
      const evidenceWeight = state.evidence.reduce((sum, id) => sum + weights[id], 0);
      const direction = state.caseType === "victim" ? 1 : -1;
      state.victimProbability = Math.max(7, Math.min(93, 50 + evidenceWeight * direction));
    }

    function nearestUncollectedEvidence() {
      let nearest = null;
      let best = Infinity;
      for (const item of state.evidenceItems) {
        if (item.collected) continue;
        const d = distance(state.player, item);
        if (d < best) { best = d; nearest = item; }
      }
      return nearest;
    }

    function spendCompute(cost) {
      if (state.compute + .001 < cost) {
        nornSay(`Ikke nok beregningskraft. ${Math.ceil(cost - state.compute)} enheter mangler.`, true);
        buzz(25);
        return false;
      }
      state.compute -= cost;
      updateHud();
      return true;
    }

    function useAgentTool(action) {
      if (state.mode !== "playing") return;
      if (action === "predict") {
        if (!spendCompute(25)) return;
        state.predictionTimer = 12;
        playScanSound();
        nornSay("Jeg har simulert R-742s neste bevegelser. Prognosen vises i gatenettet.", true);
      } else if (action === "jam") {
        if (!spendCompute(45)) return;
        state.jamTimer = Math.max(state.jamTimer, 10);
        noiseBurst(.3, .025, 350);
        beep(180, .35, "sawtooth", .025);
        nornSay("Jeg har skapt en blindsone. Private kameraer er ute i ti sekunder.", true);
      } else if (action === "crosscheck") {
        if (!spendCompute(30)) return;
        const target = nearestUncollectedEvidence();
        state.crosscheckTimer = 10;
        playScanSound();
        if (target) {
          const meters = Math.max(8, Math.round(distance(state.player, target) / 5));
          nornSay(`Kryssjekk fullført: ${target.label}, anslått avstand ${meters} meter.`, true);
        } else {
          const role = state.victimProbability >= 50 ? "offer" : "trussel";
          nornSay(`Alle kilder er korrelert. Min sterkeste hypotese er ${role}.`, true);
        }
      }
    }

    function collectEvidence(item) {
      if (item.collected) return;
      item.collected = true;
      state.evidence.push(item.id);
      if (item.id === "cctv") state.jamTimer = 9;
      updateBelief();
      playEvidenceSound();
      buzz(35);
      const victimChance = Math.round(state.victimProbability);
      nornSay(`Ny korrelasjon. Offer ${victimChance} prosent. Trussel ${100 - victimChance} prosent.`);
      updateHud();
      showEvidence(item);
    }

    function scanCivilian(person) {
      person.scanned = true;
      playScanSound();
      nornSay(`${person.id} er kryssjekket mot 31 registre. Ingen samsvar med hendelsesgrafen.`, true);
    }

    function interact() {
      if (state.mode !== "playing") return;
      const target = state.nearTarget || findInteractionTarget();
      if (!target) {
        beep(180, .04, "square", .012);
        nornSay("Jeg finner ingen relevant datakilde innen lokal rekkevidde.", true);
        return;
      }
      if (target.type === "evidence") collectEvidence(target.item);
      else if (target.type === "subject") showDecision();
      else if (target.type === "civilian") scanCivilian(target.item);
    }

    function findInteractionTarget() {
      let closest = null;
      let closestDistance = Infinity;
      for (const item of state.evidenceItems) {
        if (item.collected) continue;
        const d = distance(state.player, item);
        if (d < 72 && d < closestDistance) {
          closest = { type: "evidence", item };
          closestDistance = d;
        }
      }
      const subjectDistance = distance(state.player, state.subject);
      if (state.evidence.length >= 2 && subjectDistance < 92 && subjectDistance < closestDistance) {
        closest = { type: "subject", item: state.subject };
        closestDistance = subjectDistance;
      }
      for (const person of state.civilians) {
        const d = distance(state.player, person);
        if (d < 58 && d < closestDistance) {
          closest = { type: "civilian", item: person };
          closestDistance = d;
        }
      }
      return closest;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function angleDelta(a, b) {
      return Math.atan2(Math.sin(a - b), Math.cos(a - b));
    }

    function pointInCone(point, source, direction, range, halfAngle) {
      const dx = point.x - source.x;
      const dy = point.y - source.y;
      const d = Math.hypot(dx, dy);
      if (d > range || d < 2) return false;
      return Math.abs(angleDelta(Math.atan2(dy, dx), direction)) < halfAngle;
    }

    function circleRectCollision(x, y, radius, rect) {
      const nearestX = Math.max(rect.x, Math.min(x, rect.x + rect.w));
      const nearestY = Math.max(rect.y, Math.min(y, rect.y + rect.h));
      const dx = x - nearestX;
      const dy = y - nearestY;
      return dx * dx + dy * dy < radius * radius;
    }

    function blocked(x, y, radius = PLAYER_RADIUS) {
      if (x < radius || y < radius || x > WORLD.w - radius || y > WORLD.h - radius) return true;
      return buildings.some(building => circleRectCollision(x, y, radius, building));
    }

    function movePlayer(dx, dy, dt) {
      const length = Math.hypot(dx, dy);
      if (length < .05) return;
      dx /= Math.max(1, length);
      dy /= Math.max(1, length);
      state.player.dir = Math.atan2(dy, dx);
      const speed = 205;
      const nextX = state.player.x + dx * speed * dt;
      const nextY = state.player.y + dy * speed * dt;
      if (!blocked(nextX, state.player.y)) state.player.x = nextX;
      if (!blocked(state.player.x, nextY)) state.player.y = nextY;
    }

    function followRoute(person, dt) {
      if (!person.route.length) return;
      const target = person.route[person.routeIndex];
      const dx = target[0] - person.x;
      const dy = target[1] - person.y;
      const d = Math.hypot(dx, dy);
      if (d < 7) {
        person.routeIndex += 1;
        if (person.routeIndex >= person.route.length) person.routeIndex = person.loop ? 0 : person.route.length - 1;
        return;
      }
      person.dir = Math.atan2(dy, dx);
      person.x += (dx / d) * person.speed * dt;
      person.y += (dy / d) * person.speed * dt;
    }

    function getMovementInput() {
      let x = joystick.x;
      let y = joystick.y;
      if (keys.has("arrowleft") || keys.has("a")) x -= 1;
      if (keys.has("arrowright") || keys.has("d")) x += 1;
      if (keys.has("arrowup") || keys.has("w")) y -= 1;
      if (keys.has("arrowdown") || keys.has("s")) y += 1;
      return { x, y };
    }

    function update(dt) {
      if (state.mode !== "playing") return;
      state.elapsed += dt;
      state.time = Math.max(0, state.time - dt);
      state.jamTimer = Math.max(0, state.jamTimer - dt);
      state.predictionTimer = Math.max(0, state.predictionTimer - dt);
      state.crosscheckTimer = Math.max(0, state.crosscheckTimer - dt);
      state.compute = Math.min(100, state.compute + dt * 2.25);
      if (state.toastTimer > 0) {
        state.toastTimer -= dt;
        if (state.toastTimer <= 0) toastEl.classList.remove("visible");
      }

      const input = getMovementInput();
      movePlayer(input.x, input.y, dt);
      if (Math.hypot(input.x, input.y) > .08) {
        state.footstepTimer -= dt;
        if (state.footstepTimer <= 0) {
          playFootstep();
          state.footstepTimer = .34;
        }
      } else {
        state.footstepTimer = 0;
      }
      followRoute(state.subject, dt);
      state.civilians.forEach(person => followRoute(person, dt));

      for (const watcher of state.watchers) {
        watcher.active = state.evidence.length > 0;
        if (watcher.active) followRoute(watcher, dt);
      }

      let detections = 0;
      if (state.jamTimer <= 0) {
        for (const camera of privateCameras) {
          const direction = camera.base + Math.sin(state.elapsed * camera.speed) * camera.sweep;
          if (pointInCone(state.player, camera, direction, camera.range, .31)) detections += 1;
        }
      }
      for (const watcher of state.watchers) {
        if (watcher.active && pointInCone(state.player, watcher, watcher.dir, watcher.range, watcher.fov / 2)) detections += 1;
      }

      state.detected = detections > 0;
      if (state.detected && !state.wasDetected) {
        playAlertSound();
        nornSay("Privat optikk har låst seg til bevegelsen din. Bryt synslinjen.", true);
      } else if (!state.detected && state.wasDetected) {
        nornSay("Sporingen er brutt. Jeg renser den siste digitale signaturen.");
      }
      state.wasDetected = state.detected;
      if (state.detected) state.trace = Math.min(100, state.trace + dt * (18 + detections * 6));
      else state.trace = Math.max(0, state.trace - dt * 7.5);

      if (state.trace > 74 && !state.autoRescueUsed && state.compute >= 45) {
        state.autoRescueUsed = true;
        state.compute -= 45;
        state.jamTimer = Math.max(state.jamTimer, 7);
        state.trace = Math.max(0, state.trace - 22);
        noiseBurst(.35, .03, 300);
        nornSay("Jeg griper inn autonomt: falsk identitet injisert, kameraene blendet. Det kostet 45 kraft.", true);
      }

      if (state.time < 55 && !state.timeWarningGiven) {
        state.timeWarningGiven = true;
        beep(240, .28, "sawtooth", .026);
        nornSay("Femti sekunder til hendelsesvinduet kollapser. Prioriter beslutning fremfor full sikkerhet.", true);
      }

      state.nearTarget = findInteractionTarget();
      updateHud();
      updateCamera(dt);

      if (state.trace >= 100) {
        endGame(false, "Det private overvåkingsnettet identifiserte deg. Din tilgang til NORN er kompromittert.");
      } else if (state.time <= 0) {
        endGame(false, "Tidsvinduet lukket seg før du grep inn. Hendelsen fant sted, men NORN registrerte ikke utfallet.");
      }
    }

    function updateCamera(dt) {
      const targetX = Math.max(0, Math.min(WORLD.w - view.w, state.player.x - view.w / 2));
      const targetY = Math.max(0, Math.min(WORLD.h - view.h, state.player.y - view.h / 2));
      const ease = 1 - Math.pow(.001, dt);
      state.camera.x += (targetX - state.camera.x) * ease;
      state.camera.y += (targetY - state.camera.y) * ease;
    }

    function objectiveTarget() {
      if (state.evidence.length >= 2) return state.subject;
      let nearest = null;
      let best = Infinity;
      for (const item of state.evidenceItems) {
        if (item.collected) continue;
        const d = distance(state.player, item);
        if (d < best) { best = d; nearest = item; }
      }
      return nearest;
    }

    function updateHud() {
      const seconds = Math.ceil(state.time);
      timerEl.textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      timerEl.style.color = seconds < 35 ? COLORS.red : "#fff";
      evidenceEl.textContent = `${state.evidence.length} / 3`;
      traceEl.textContent = `${Math.round(state.trace)}%`;
      traceBar.style.width = `${state.trace}%`;
      traceBar.style.background = state.trace > 70 ? COLORS.red : state.trace > 38 ? COLORS.amber : COLORS.cyan;
      const victimChance = Math.round(state.victimProbability);
      victimProbabilityEl.textContent = `${victimChance}%`;
      threatProbabilityEl.textContent = `${100 - victimChance}%`;
      beliefFillEl.style.width = `${victimChance}%`;
      powerValueEl.textContent = `${Math.round(state.compute)}%`;
      powerFillEl.style.width = `${state.compute}%`;
      nornStatusEl.textContent = state.detected ? "MOTARBEIDER" : state.jamTimer > 0 ? "SKJULER" : state.predictionTimer > 0 ? "SIMULERER" : "ONLINE";
      const toolCosts = { predict: 25, jam: 45, crosscheck: 30 };
      for (const button of agentButtons) {
        button.disabled = state.mode !== "playing" || state.compute < toolCosts[button.dataset.agent];
      }
      if (state.evidence.length < 2) {
        objectiveEl.textContent = `Finn datakilder (${state.evidence.length}/2 kreves). Følg den gule markøren.`;
      } else if (state.evidence.length < 3) {
        objectiveEl.textContent = "Avskjær R-742 og velg handling – eller finn det siste sporet.";
      } else {
        objectiveEl.textContent = "Alle spor funnet. Avskjær R-742 og avgjør saken.";
      }

      const target = state.nearTarget;
      if (!target) {
        actionBtn.textContent = "SKANN";
        actionBtn.classList.remove("ready");
      } else {
        actionBtn.textContent = target.type === "evidence" ? "HENT SPOR" : target.type === "subject" ? "AVGJØR" : "SKANN ID";
        actionBtn.classList.add("ready");
      }
    }

    function worldToScreen(x, y) {
      return { x: x - state.camera.x, y: y - state.camera.y };
    }

    function drawRoads() {
      ctx.fillStyle = "#111a21";
      ctx.fillRect(0, 0, WORLD.w, WORLD.h);

      ctx.strokeStyle = "rgba(178, 205, 209, .14)";
      ctx.lineWidth = 2;
      ctx.setLineDash([20, 26]);
      for (const x of [430, 1060]) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD.h);
        ctx.stroke();
      }
      for (const y of [345, 790]) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD.w, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      ctx.fillStyle = "rgba(230, 244, 242, .1)";
      for (const x of [320, 520, 960, 1140]) ctx.fillRect(x, 0, 2, WORLD.h);
      for (const y of [270, 420, 710, 870]) ctx.fillRect(0, y, WORLD.w, 2);

      drawCrosswalk(430, 345);
      drawCrosswalk(1060, 345);
      drawCrosswalk(430, 790);
      drawCrosswalk(1060, 790);
    }

    function drawCrosswalk(x, y) {
      ctx.fillStyle = "rgba(215, 235, 234, .12)";
      for (let i = -4; i <= 4; i++) {
        ctx.fillRect(x - 55 + i * 13, y - 34, 7, 68);
      }
    }

    function drawBuildings() {
      for (let index = 0; index < buildings.length; index++) {
        const b = buildings[index];
        ctx.fillStyle = index % 2 ? "#071016" : "#09131a";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = "rgba(94, 246, 232, .13)";
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);

        ctx.fillStyle = "rgba(94, 246, 232, .06)";
        for (let wx = b.x + 22; wx < b.x + b.w - 20; wx += 42) {
          for (let wy = b.y + 24; wy < b.y + b.h - 20; wy += 38) {
            const flicker = ((Math.floor(wx + wy + index * 7) % 5) === 0) ? .16 : .05;
            ctx.fillStyle = `rgba(94, 246, 232, ${flicker})`;
            ctx.fillRect(wx, wy, 17, 8);
          }
        }

        ctx.fillStyle = "rgba(217, 255, 251, .22)";
        ctx.font = "11px ui-monospace, monospace";
        ctx.fillText(b.name, b.x + 15, b.y + b.h - 14);
      }
    }

    function drawCameraCones() {
      if (state.jamTimer > 0) return;
      for (const camera of privateCameras) {
        const direction = camera.base + Math.sin(state.elapsed * camera.speed) * camera.sweep;
        drawCone(camera.x, camera.y, direction, camera.range, .31, "rgba(255, 82, 99, .105)");
        ctx.save();
        ctx.translate(camera.x, camera.y);
        ctx.rotate(direction);
        ctx.fillStyle = COLORS.red;
        ctx.fillRect(-5, -5, 12, 10);
        ctx.fillStyle = "rgba(255,255,255,.8)";
        ctx.fillRect(7, -2, 6, 4);
        ctx.restore();
      }
    }

    function drawCone(x, y, direction, range, halfAngle, color) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, range, direction - halfAngle, direction + halfAngle);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = color.replace(/\.[0-9]+\)/, ".28)");
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawEvidence() {
      const pulse = 1 + Math.sin(state.elapsed * 4) * .13;
      for (const item of state.evidenceItems) {
        if (item.collected) continue;
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = COLORS.amber;
        ctx.lineWidth = 2;
        ctx.shadowColor = COLORS.amber;
        ctx.shadowBlur = 14;
        ctx.strokeRect(-15 * pulse, -15 * pulse, 30 * pulse, 30 * pulse);
        ctx.rotate(-Math.PI / 4);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff1bd";
        ctx.font = "bold 11px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.icon, 0, 1);
        ctx.restore();

        ctx.fillStyle = "rgba(255, 229, 154, .7)";
        ctx.font = "10px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText(item.label, item.x, item.y + 31);
      }
    }

    function drawPerson(person, color, radius = 11, label = "") {
      ctx.save();
      ctx.translate(person.x, person.y);
      ctx.fillStyle = "rgba(0,0,0,.38)";
      ctx.beginPath();
      ctx.ellipse(2, 9, radius + 4, radius * .5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = color === COLORS.muted ? 0 : 10;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,.72)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(person.dir) * 4, Math.sin(person.dir) * 4);
      ctx.lineTo(Math.cos(person.dir) * (radius + 7), Math.sin(person.dir) * (radius + 7));
      ctx.stroke();
      ctx.restore();
      if (label) {
        ctx.fillStyle = color;
        ctx.font = "10px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText(label, person.x, person.y - radius - 10);
      }
    }

    function drawActors() {
      for (const watcher of state.watchers) {
        if (!watcher.active) continue;
        drawCone(watcher.x, watcher.y, watcher.dir, watcher.range, watcher.fov / 2, "rgba(255, 82, 99, .075)");
        drawPerson(watcher, COLORS.red, 11, state.evidence.length >= 2 ? "UKJENT" : "");
      }
      state.civilians.forEach(person => drawPerson(person, person.scanned ? "#688184" : COLORS.muted, 9, person.scanned ? person.id : ""));
      drawPerson(state.subject, COLORS.amber, 12, "R-742");

      ctx.save();
      ctx.translate(state.player.x, state.player.y);
      ctx.rotate(state.player.dir);
      ctx.shadowColor = COLORS.cyan;
      ctx.shadowBlur = state.detected ? 22 : 12;
      ctx.fillStyle = state.detected ? "#ffffff" : COLORS.cyan;
      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(-11, -11);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-11, 11);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(94,246,232,.3)";
      ctx.beginPath();
      ctx.arc(0, 0, 24, -2.4, 2.4);
      ctx.stroke();
      ctx.restore();
    }

    function drawNornProjection() {
      if (state.predictionTimer > 0) {
        ctx.save();
        ctx.strokeStyle = "rgba(94, 246, 232, .72)";
        ctx.fillStyle = "rgba(94, 246, 232, .2)";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 9]);
        ctx.beginPath();
        ctx.moveTo(state.subject.x, state.subject.y);
        for (let i = 0; i < Math.min(4, state.subject.route.length); i++) {
          const point = state.subject.route[(state.subject.routeIndex + i) % state.subject.route.length];
          ctx.lineTo(point[0], point[1]);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        for (let i = 0; i < 3; i++) {
          const point = state.subject.route[(state.subject.routeIndex + i) % state.subject.route.length];
          ctx.beginPath();
          ctx.arc(point[0], point[1], 8 + Math.sin(state.elapsed * 5 + i) * 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = COLORS.cyan;
        ctx.font = "10px ui-monospace, monospace";
        ctx.textAlign = "left";
        ctx.fillText(`NORN PROGNOSE ${state.predictionTimer.toFixed(1)}s`, state.subject.x + 18, state.subject.y + 5);
        ctx.restore();
      }

      if (state.crosscheckTimer > 0) {
        const target = nearestUncollectedEvidence();
        if (!target) return;
        ctx.save();
        ctx.strokeStyle = "rgba(255, 200, 87, .7)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 7]);
        ctx.beginPath();
        ctx.moveTo(state.player.x, state.player.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = COLORS.amber;
        ctx.beginPath();
        ctx.arc(target.x, target.y, 45 + Math.sin(state.elapsed * 6) * 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawObjectiveIndicator() {
      const target = objectiveTarget();
      if (!target) return;
      const screen = worldToScreen(target.x, target.y);
      const margin = 54;
      const onScreen = screen.x > margin && screen.x < view.w - margin && screen.y > margin && screen.y < view.h - margin;
      if (onScreen) {
        ctx.save();
        ctx.translate(screen.x, screen.y);
        ctx.strokeStyle = COLORS.amber;
        ctx.globalAlpha = .6;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 34 + Math.sin(state.elapsed * 3) * 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        return;
      }

      const center = { x: view.w / 2, y: view.h / 2 };
      const angle = Math.atan2(screen.y - center.y, screen.x - center.x);
      const radiusX = Math.max(30, view.w / 2 - 48);
      const radiusY = Math.max(30, view.h / 2 - 48);
      const scale = Math.min(
        Math.abs(radiusX / (Math.cos(angle) || .001)),
        Math.abs(radiusY / (Math.sin(angle) || .001))
      );
      const x = center.x + Math.cos(angle) * scale;
      const y = center.y + Math.sin(angle) * scale;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = COLORS.amber;
      ctx.shadowColor = COLORS.amber;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.lineTo(-9, -8);
      ctx.lineTo(-5, 0);
      ctx.lineTo(-9, 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawRain() {
      ctx.save();
      ctx.strokeStyle = "rgba(164, 226, 225, .09)";
      ctx.lineWidth = 1;
      const t = state.elapsed * 160;
      for (let i = 0; i < 42; i++) {
        const x = (i * 97 + t * .28) % (view.w + 70) - 35;
        const y = (i * 53 + t * (1 + (i % 3) * .13)) % (view.h + 60) - 30;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 8, y + 18);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawMinimap() {
      const w = mini.width;
      const h = mini.height;
      const sx = w / WORLD.w;
      const sy = h / WORLD.h;
      mctx.fillStyle = "#050c11";
      mctx.fillRect(0, 0, w, h);
      mctx.fillStyle = "#101d24";
      for (const b of buildings) mctx.fillRect(b.x * sx, b.y * sy, b.w * sx, b.h * sy);
      mctx.strokeStyle = "rgba(94,246,232,.18)";
      mctx.strokeRect(state.camera.x * sx, state.camera.y * sy, Math.min(view.w, WORLD.w) * sx, Math.min(view.h, WORLD.h) * sy);
      for (const item of state.evidenceItems) {
        if (item.collected) continue;
        mctx.fillStyle = COLORS.amber;
        mctx.fillRect(item.x * sx - 3, item.y * sy - 3, 6, 6);
      }
      mctx.fillStyle = COLORS.amber;
      mctx.beginPath();
      mctx.arc(state.subject.x * sx, state.subject.y * sy, 4, 0, Math.PI * 2);
      mctx.fill();
      mctx.fillStyle = COLORS.cyan;
      mctx.beginPath();
      mctx.arc(state.player.x * sx, state.player.y * sy, 5, 0, Math.PI * 2);
      mctx.fill();
    }

    function draw() {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = "#060d12";
      ctx.fillRect(0, 0, view.w, view.h);

      ctx.save();
      ctx.translate(-state.camera.x, -state.camera.y);
      drawRoads();
      drawBuildings();
      drawCameraCones();
      drawEvidence();
      drawNornProjection();
      drawActors();
      ctx.restore();

      drawObjectiveIndicator();
      drawRain();
      drawMinimap();

      if (state.detected && state.mode === "playing") {
        ctx.strokeStyle = `rgba(255, 82, 99, ${.28 + Math.sin(state.elapsed * 9) * .12})`;
        ctx.lineWidth = 5;
        ctx.strokeRect(2, 2, view.w - 4, view.h - 4);
      }
      if (state.jamTimer > 0 && state.mode === "playing") {
        ctx.fillStyle = "rgba(94,246,232,.72)";
        ctx.font = "10px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText(`KAMERANETT BLOKKERT ${state.jamTimer.toFixed(1)}s`, view.w / 2, view.h - 16);
      }
    }

    function frame(now) {
      const dt = Math.min(.033, Math.max(0, (now - lastFrame) / 1000));
      lastFrame = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    function updateJoystick(event) {
      const rect = joyBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = event.clientX - centerX;
      let dy = event.clientY - centerY;
      const max = rect.width * .32;
      const d = Math.hypot(dx, dy);
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      joystick.x = dx / max;
      joystick.y = dy / max;
      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    function releaseJoystick(event) {
      if (event && joystick.id !== event.pointerId) return;
      joystick.active = false;
      joystick.id = null;
      joystick.x = 0;
      joystick.y = 0;
      joyStick.style.transform = "translate(0, 0)";
    }

    overlay.addEventListener("click", event => {
      const button = event.target.closest("[data-act]");
      if (button) handleOverlayAction(button.dataset.act);
    });

    joyBase.addEventListener("pointerdown", event => {
      joystick.active = true;
      joystick.id = event.pointerId;
      joyBase.setPointerCapture(event.pointerId);
      updateJoystick(event);
    });
    joyBase.addEventListener("pointermove", event => {
      if (joystick.active && joystick.id === event.pointerId) updateJoystick(event);
    });
    joyBase.addEventListener("pointerup", releaseJoystick);
    joyBase.addEventListener("pointercancel", releaseJoystick);

    actionBtn.addEventListener("click", interact);
    agentButtons.forEach(button => button.addEventListener("click", () => useAgentTool(button.dataset.agent)));
    pauseBtn.addEventListener("click", () => {
      if (state.mode === "paused") handleOverlayAction("resume");
      else showPause();
    });
    musicBtn.addEventListener("click", () => {
      if (!audioReady && state.music) {
        unlockAudio(true);
        return;
      }
      state.music = !state.music;
      musicBtn.textContent = state.music ? "MUS♫" : "MUS×";
      if (state.music) {
        unlockAudio(true);
      }
      setMusicLevel(desiredMusicLevel(), .22);
    });
    soundBtn.addEventListener("click", () => {
      if (!audioReady && state.sound) {
        unlockAudio(false);
        return;
      }
      state.sound = !state.sound;
      soundBtn.textContent = state.sound ? "SFX" : "SFX×";
      if (state.sound) unlockAudio(false);
      if (audioContext && sfxBus) {
        sfxBus.gain.setTargetAtTime(state.sound ? .86 : 0, audioContext.currentTime, .025);
      }
      if (state.sound) beep(620, .05, "square", .02);
    });

    const primeAudioFromGesture = () => {
      if (!audioReady && (state.music || state.sound)) unlockAudio(false);
    };
    addEventListener("pointerdown", primeAudioFromGesture, { capture: true, passive: true });
    addEventListener("touchend", primeAudioFromGesture, { capture: true, passive: true });

    addEventListener("keydown", event => {
      primeAudioFromGesture();
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) event.preventDefault();
      keys.add(key);
      if (!event.repeat && (key === " " || key === "e")) interact();
      if (!event.repeat && key === "p") {
        if (state.mode === "playing") showPause();
        else if (state.mode === "paused") handleOverlayAction("resume");
      }
    }, { passive: false });
    addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
    addEventListener("blur", () => {
      keys.clear();
      releaseJoystick();
      lastFrame = performance.now();
    });
    addEventListener("resize", resize);
    document.addEventListener("visibilitychange", () => {
      keys.clear();
      releaseJoystick();
      lastFrame = performance.now();
      if (!document.hidden && audioContext?.state === "running") {
        audioReady = true;
        setMusicLevel(desiredMusicLevel(), .18);
      }
    });
    addEventListener("pageshow", () => {
      keys.clear();
      releaseJoystick();
      lastFrame = performance.now();
    });

    resize();
    resetGame();
    showStart();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
